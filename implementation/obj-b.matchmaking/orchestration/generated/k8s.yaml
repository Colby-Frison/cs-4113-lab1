# Refined from compose.grpc.yml. Kompose's translation is the
# mechanical step; this file adds the namespace, probes, resources,
# the shared FIFO and result volumes, and a Job for the generator.
apiVersion: v1
kind: Namespace
metadata:
  name: matchmaking
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matchmaking-fifos
  namespace: matchmaking
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matchmaking-results
  namespace: matchmaking
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fifo-hold
  namespace: matchmaking
  labels:
    app.kubernetes.io/name: matchmaking
    app.kubernetes.io/component: fifo-hold
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: fifo-hold
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matchmaking
        app.kubernetes.io/component: fifo-hold
    spec:
      restartPolicy: Always
      containers:
      - name: fifo-hold
        image: matchmaking:local
        imagePullPolicy: IfNotPresent
        args:
          - "python"
          - "-c"
          - "import time; time.sleep(10**9)"
        env:
        - name: CLEAR_FILES
          value: "/fifos/admit.ready"
        - name: HEALTH_EXIST
          value: "/fifos/jobs"
        - name: HOLD_FIFOS
          value: "/fifos/jobs"
        startupProbe:
          exec:
            command:
            - python
            - "/app/obj-b.matchmaking/orchestration/healthcheck.py"
          periodSeconds: 2
          failureThreshold: 90
          timeoutSeconds: 3
        readinessProbe:
          exec:
            command:
            - python
            - "/app/obj-b.matchmaking/orchestration/healthcheck.py"
          periodSeconds: 2
          failureThreshold: 3
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command:
            - python
            - "/app/obj-b.matchmaking/orchestration/healthcheck.py"
          periodSeconds: 20
          failureThreshold: 3
          timeoutSeconds: 3
        resources:
          requests:
            cpu: "50m"
            memory: 64Mi
          limits:
            cpu: "1"
            memory: 256Mi
        volumeMounts:
        - name: fifos
          mountPath: /fifos
      volumes:
      - name: fifos
        persistentVolumeClaim:
          claimName: matchmaking-fifos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: q-admit
  namespace: matchmaking
  labels:
    app.kubernetes.io/name: matchmaking
    app.kubernetes.io/component: q-admit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: q-admit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matchmaking
        app.kubernetes.io/component: q-admit
    spec:
      restartPolicy: Always
      containers:
      - name: q-admit
        image: matchmaking:local
        imagePullPolicy: IfNotPresent
        args:
          - "python"
          - "/app/obj-a/queue/queue.py"
          - "--qid"
          - "q-admit"
          - "--qsize"
          - "16"
          - "--metrics-port"
          - "9100"
          - "-i"
          - "/fifos/jobs"
          - "--outgrpc"
          - "s-validate:5001,1"
        env:
        - name: HEALTH_READY
          value: "/fifos/admit.ready"
        - name: READY_FILE
          value: "/fifos/admit.ready"
        - name: SIGNAL_FIFO
          value: "/fifos/jobs"
        - name: WAIT_FOR
          value: "s-validate:5001"
        startupProbe:
          exec:
            command:
            - python
            - "/app/obj-b.matchmaking/orchestration/healthcheck.py"
          periodSeconds: 2
          failureThreshold: 90
          timeoutSeconds: 3
        readinessProbe:
          exec:
            command:
            - python
            - "/app/obj-b.matchmaking/orchestration/healthcheck.py"
          periodSeconds: 2
          failureThreshold: 3
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command:
            - python
            - "/app/obj-b.matchmaking/orchestration/healthcheck.py"
          periodSeconds: 20
          failureThreshold: 3
          timeoutSeconds: 3
        resources:
          requests:
            cpu: "50m"
            memory: 64Mi
          limits:
            cpu: "1"
            memory: 256Mi
        volumeMounts:
        - name: fifos
          mountPath: /fifos
      volumes:
      - name: fifos
        persistentVolumeClaim:
          claimName: matchmaking-fifos
---
