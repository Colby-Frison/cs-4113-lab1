syntax = "proto3";

// Shared job record for every Objective A edge.
// raw_line is the CSV row the file/FIFO path already uses. Structured fields
// are filled too, so a peer can rebuild the row if raw_line is empty.

message Task {
  int32 tid = 1;
  double wait_seconds = 2;
}

message Job {
  string job_id = 1;
  double arrival_time = 2;
  repeated Task tasks = 3;
  string raw_line = 4;
  // Packet header for the routing application. Other applications leave these
  // unset. The message is authoritative, because ttl and next_hop change on
  // the way while raw_line does not.
  fixed32 dst_ip = 5;   // IPv4 destination as a 32-bit integer
  int32 ttl = 6;
  string next_hop = 7;  // Filled by a lookup stage for the forward stage
}

message SubmitJobRequest {
  Job job = 1;
  // Edge label the receiver writes in ARRIVE-VIA (queue id or host:port).
  string source_edge = 2;
  // Logical queue inside a process that hosts many buffers. Empty means the
  // single-queue programs, which ignore this field and use their own --qid.
  string dest_qid = 3;
}

message SubmitJobResponse {
  // False means the queue dropped the job and logged ERROR QUEUE-FULL.
  // A server function always accepts; it has no buffer of its own.
  bool accepted = 1;
}
