{
  "name": "food-delivery-grpc",
  "services": {
    "init": {
      "image": "food-delivery:local",
      "command": [
        "init"
      ],
      "environment": {
        "FOOD_CONFIG": "{\"kitchen_workers\": 2, \"couriers\": 3, \"kitchen_capacity\": 16, \"pickup_capacity\": 16, \"count\": 100, \"arrival_mean\": 0.04, \"time_scale\": 1.0, \"seed\": 1}",
        "FOOD_TRANSPORT": "grpc"
      },
      "volumes": [
        "../runs/grpc:/data"
      ],
      "restart": "no"
    },
    "q0": {
      "image": "food-delivery:local",
      "command": [
        "queue",
        "--name",
        "q0"
      ],
      "environment": {
        "FOOD_CONFIG": "{\"kitchen_workers\": 2, \"couriers\": 3, \"kitchen_capacity\": 16, \"pickup_capacity\": 16, \"count\": 100, \"arrival_mean\": 0.04, \"time_scale\": 1.0, \"seed\": 1}",
        "FOOD_TRANSPORT": "grpc"
      },
      "volumes": [
        "../runs/grpc:/data"
      ],
      "restart": "no",
      "depends_on": {
        "init": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "test",
          "-f",
          "/data/run/q0.ready"
        ],
        "interval": "1s",
        "timeout": "1s",
        "retries": 30
      },
      "expose": [
        "50050"
      ]
    },
